name: Build Single Calendar APK

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-single-calendar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: SingleCalendarWidget-preview-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Add SIGNING_KEYSTORE_BASE64 and the other signing secrets in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/single-calendar-release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/single-calendar-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk SingleCalendarWidget.apk

      - name: Verify APK signature
        run: jarsigner -verify -verbose -certs SingleCalendarWidget.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingleCalendarWidget
          path: SingleCalendarWidget.apk
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: single-calendar-v${{ github.run_number }}
          name: 单向历小组件 v1.0.${{ github.run_number }}
          body: |
            单向历安卓桌面小组件，适配 Android / HyperOS。

            - 使用固定 Release 签名，支持同签名版本覆盖更新
            - 按北京时间每日更新
            - 点击小组件可手动刷新
            - 网络失败时保留上次成功图片
          files: SingleCalendarWidget.apk
          fail_on_unmatched_files: true
